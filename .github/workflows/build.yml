name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for versioning)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        env:
          VK_CLIENT_ID: ${{ secrets.VK_CLIENT_ID }}
          VK_CLIENT_SECRET: ${{ secrets.VK_CLIENT_SECRET }}
        run: ./gradlew testProdDebugUnitTest --stacktrace

      - name: Build stage debug APK
        env:
          VK_CLIENT_ID: ${{ secrets.VK_CLIENT_ID }}
          VK_CLIENT_SECRET: ${{ secrets.VK_CLIENT_SECRET }}
        run: ./gradlew assembleStageDebug --stacktrace

      - name: Build prod release APK (unsigned)
        env:
          VK_CLIENT_ID: ${{ secrets.VK_CLIENT_ID }}
          VK_CLIENT_SECRET: ${{ secrets.VK_CLIENT_SECRET }}
        run: ./gradlew assembleProdRelease --stacktrace

      - name: Upload stage debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vk-tea-stage-debug
          path: app/build/outputs/apk/stage/debug/*.apk

      - name: Upload prod release APK
        uses: actions/upload-artifact@v4
        with:
          name: vk-tea-prod-release
          path: app/build/outputs/apk/prod/release/*.apk
