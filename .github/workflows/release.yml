name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name (e.g. 0.5.0), without v prefix'
        required: true
        default: '0.5.0'

jobs:
  release:
    name: Signed release with changelog
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout (full history for changelog)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > signing.keystore
          else
            echo "KEYSTORE_BASE64 not set, falling back to debug keystore"
            cp debug.keystore signing.keystore
          fi

      - name: Build signed prod release APK
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          KEYSTORE_FILE: ${{ github.workspace }}/signing.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VK_CLIENT_ID: ${{ secrets.VK_CLIENT_ID }}
          VK_CLIENT_SECRET: ${{ secrets.VK_CLIENT_SECRET }}
        run: ./gradlew assembleProdRelease --stacktrace

      - name: Generate changelog from commits
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.name }}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            CURRENT_TAG="$GITHUB_REF_NAME"
          else
            CURRENT_TAG=""
          fi
          PREV_TAG=$(git tag --sort=-creatordate | grep -v "^${CURRENT_TAG}$" | head -1 || true)
          if [ -n "$PREV_TAG" ] && [ -n "$CURRENT_TAG" ]; then
            RANGE="${PREV_TAG}..${CURRENT_TAG}"
          elif [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..HEAD"
          else
            RANGE="HEAD"
          fi
          echo "Changelog range: $RANGE" >&2

          {
            echo "## Что нового"
            echo ""
            FEATS=$(git log "$RANGE" --no-merges --pretty=format:'%s' | grep -E '^(feat|add)(\(|:)' | sed 's/^/ - /' || true)
            FIXES=$(git log "$RANGE" --no-merges --pretty=format:'%s' | grep -E '^(fix|bug)(\(|:)' | sed 's/^/ - /' || true)
            OTHER=$(git log "$RANGE" --no-merges --pretty=format:'%s' | grep -vE '^(feat|add|fix|bug|chore|ci)(\(|:)' | grep -vE '^Merge' | sed 's/^/ - /' || true)
            if [ -n "$FEATS" ]; then echo "### Новое"; echo "$FEATS"; echo ""; fi
            if [ -n "$FIXES" ]; then echo "### Исправления"; echo "$FIXES"; echo ""; fi
            if [ -n "$OTHER" ]; then echo "### Прочее"; echo "$OTHER"; echo ""; fi
            echo "---"
            echo "**Полный список коммитов:** $RANGE"
          } > changelog.md
          cat changelog.md >&2

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: VK Tea ${{ steps.version.outputs.name }}
          body_path: changelog.md
          files: app/build/outputs/apk/prod/release/*.apk
