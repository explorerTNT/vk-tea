plugins {
    id 'com.android.application'
}

def keystoreFile = System.getenv('KEYSTORE_FILE')

def vkProps = new Properties()
def vkPropsFile = rootProject.file('local.properties')
if (vkPropsFile.exists()) {
    vkPropsFile.withInputStream { vkProps.load(it) }
}
def vkClientId = System.getenv('VK_CLIENT_ID') ?: vkProps.getProperty('vk.clientId', '54843071')
def vkClientSecret = System.getenv('VK_CLIENT_SECRET') ?: vkProps.getProperty('vk.clientSecret', '')
def ghToken = System.getenv('GH_TOKEN') ?: vkProps.getProperty('gh.token', '')

// Версионирование: versionCode = число коммитов (монотонно растёт),
// versionName = базовая версия из gradle/env + номер коммита.
// Релизный workflow передаёт VERSION_NAME из тега (v0.5.0 -> 0.5.0).
def gitCommitCount = 1
try {
    gitCommitCount = ('git rev-list --count HEAD'.execute([], rootProject.rootDir).text.trim() ?: '1').toInteger()
} catch (ignored) {
}
def baseVersionName = System.getenv('VERSION_NAME') ?: project.property('vkTea.baseVersion')

android {
    namespace 'com.vktea'
    compileSdk 35

    defaultConfig {
        applicationId 'com.vktea'
        minSdk 24
        targetSdk 35
        versionCode gitCommitCount
        versionName "${baseVersionName}.${gitCommitCount}"
        buildConfigField 'String', 'VK_CLIENT_ID', "\"${vkClientId}\""
        buildConfigField 'String', 'GH_TOKEN', "\"${ghToken}\""
    }

    flavorDimensions 'env'
    productFlavors {
        stage {
            dimension 'env'
            applicationIdSuffix '.stage'
            versionNameSuffix '-stage'
            resValue 'string', 'app_name', 'VK Tea Stage'
        }
        prod {
            dimension 'env'
            resValue 'string', 'app_name', 'VK Tea'
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            // version уже содержит flavor-суффикс (0.4.97-stage), остаётся только buildType
            def buildType = variant.buildType.name
            def version = variant.versionName
            outputFileName = "vk-tea-${version}-${buildType}.apk"
        }
    }

    if (keystoreFile != null) {
        signingConfigs {
            release {
                storeFile file(keystoreFile)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    signingConfigs {
        debug {
            storeFile rootProject.file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig keystoreFile != null ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }
}

dependencies {
    // Keep Media3 aligned with the project's compileSdk 35 / AGP 8.7 toolchain.
    def media3Version = '1.5.1'
    implementation "androidx.media3:media3-exoplayer:$media3Version"
    implementation "androidx.media3:media3-exoplayer-hls:$media3Version"
    implementation "androidx.media3:media3-session:$media3Version"
    implementation "androidx.media3:media3-ui:$media3Version"
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.github.chrisbanes:PhotoView:2.3.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
