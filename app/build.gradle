plugins {
    id 'com.android.application'
}

def keystoreFile = System.getenv('KEYSTORE_FILE')

def vkProps = new Properties()
def vkPropsFile = rootProject.file('local.properties')
if (vkPropsFile.exists()) {
    vkPropsFile.withInputStream { vkProps.load(it) }
}
def vkClientId = System.getenv('VK_CLIENT_ID') ?: vkProps.getProperty('vk.clientId', '54843071')
def vkClientSecret = System.getenv('VK_CLIENT_SECRET') ?: vkProps.getProperty('vk.clientSecret', '')

android {
    namespace 'com.vktea'
    compileSdk 35

    defaultConfig {
        applicationId 'com.vktea'
        minSdk 24
        targetSdk 35
        versionCode 4
        versionName '0.4.0'
        buildConfigField 'String', 'VK_CLIENT_ID', "\"${vkClientId}\""
    }

    if (keystoreFile != null) {
        signingConfigs {
            release {
                storeFile file(keystoreFile)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    signingConfigs {
        debug {
            storeFile rootProject.file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        qa {
            initWith debug
            applicationIdSuffix ".qa"
            matchingFallbacks = ["debug"]
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig keystoreFile != null ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }
}

dependencies {
    // Keep Media3 aligned with the project's compileSdk 35 / AGP 8.7 toolchain.
    def media3Version = '1.5.1'
    implementation "androidx.media3:media3-exoplayer:$media3Version"
    implementation "androidx.media3:media3-exoplayer-hls:$media3Version"
    implementation "androidx.media3:media3-session:$media3Version"
    implementation "androidx.media3:media3-ui:$media3Version"
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.github.chrisbanes:PhotoView:2.3.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
